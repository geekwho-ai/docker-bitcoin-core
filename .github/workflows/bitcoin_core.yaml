name: bitcoin_core

on:
  push:
    branches:
      - master
      - dev
    paths:
      - "[0-9]*/**"
      - ".github/workflows/bitcoin_core.yaml"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Trigger the workflow manually"

env:
  LATEST_VERSION: "32.1-alpine"

jobs:
  build:
    runs-on: ubuntu-latest
    # use strategy matrix build images
    strategy:
      max-parallel: 6 # Restrict to serial execution.
      matrix:
        image:
          - name: 29.5-alpine
            context: "./29.5/alpine"
          - name: 29.5-debian
            context: "./29.5/debian"
          - name: 29.5-ubuntu
            context: "./29.5/ubuntu"
          - name: 30.4-alpine
            context: "./30.4/alpine"
          - name: 30.4-centos
            context: "./30.4/centos"
          - name: 30.4-ubuntu
            context: "./30.4/ubuntu"
          - name: 31.2-alpine
            context: "./31.2/alpine"
          - name: 31.2-centos
            context: "./31.2/centos"
          - name: 31.2-ubuntu
            context: "./31.2/ubuntu"
          - name: 32.1-alpine
            context: "./32.1/alpine"
          - name: 32.1-centos
            context: "./32.1/centos"
          - name: 32.1-ubuntu
            context: "./32.1/ubuntu"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ matrix.image.name }}
      - name: Tag and push latest
        if: matrix.image.name == env.LATEST_VERSION
        run: |
          # create latest tag & push
          echo "Creating latest tag for ${{ env.LATEST_VERSION }}"
          docker buildx imagetools create \
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ env.LATEST_VERSION }} \
            --tag ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:latest
          echo "Latest tag created successfully"
